<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw trusted execution path — Diagram Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      color: var(--muted);
      font: 500 12px/1 var(--mono);
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font: 400 40px/1.08 var(--serif);
      letter-spacing: -.02em;
      margin-bottom: 8px;
    }
    .subtitle { color: var(--muted); font-size: 16px; margin-bottom: 20px; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Secure paved road · Architecture · Executive</p>
    <h1>Only evidenced actions cross the runtime boundary</h1>
    <p class="subtitle">Trusted intake and guarded maintenance continue. Public ingress and blind recovery stop before execution.</p>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-design-title diagram-design-desc">

      <desc id="diagram-design-desc">Secure architecture showing permitted Telegram intake, rotated identity, isolated runtime, guarded recovery and audit proof, while public webhook ingress and blind force reset are blocked before execution.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- Trust zones -->
      <rect x="40" y="80" width="240" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="56" y="84" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="96" y="96" fill="rgba(45,49,66,0.48)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.16em">EXTERNAL</text>

      <rect x="320" y="80" width="620" height="440" rx="8" fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.50)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="336" y="84" width="144" height="16" rx="2" fill="#f5f5f5"/>
      <text x="408" y="96" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.16em">PROTECTED RUNTIME</text>

      <rect x="980" y="80" width="260" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="996" y="84" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1036" y="96" fill="rgba(45,49,66,0.48)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.16em">EVIDENCE</text>

      <!-- Paths first -->
      <line x1="240" y1="288" x2="360" y2="288" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="540" y1="288" x2="700" y2="288" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="880" y1="288" x2="1020" y2="288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="450" y1="192" x2="450" y2="240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="240" y1="448" x2="304" y2="448" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,4"/>
      <path d="M 540,448 H 616 Q 624,448 624,440 V 364" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,4"/>

      <rect x="252" y="260" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="300" y="272" fill="#2e5aa8" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERMITTED</text>
      <rect x="576" y="260" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="620" y="272" fill="#eb6c36" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXECUTE</text>
      <rect x="912" y="260" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="950" y="272" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ATTEST</text>
      <rect x="460" y="204" width="92" height="24" rx="2" fill="#f5f5f5"/>
      <text x="472" y="220" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.06em">IDENTITY</text>
      <rect x="800" y="352" width="96" height="24" rx="2" fill="#f5f5f5"/>
      <text x="812" y="368" fill="#eb6c36" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.06em">APPROVED</text>
      <rect x="244" y="416" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="288" y="428" fill="#eb6c36" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORBIDDEN</text>
      <rect x="552" y="416" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="592" y="428" fill="#eb6c36" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DENIED</text>

      <!-- Stop symbols terminate blocked paths before the runtime boundary. -->
      <circle cx="304" cy="448" r="12" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1.2"/>
      <path d="M 296,440 L 312,456 M 312,440 L 296,456" fill="none" stroke="#eb6c36" stroke-width="1.2"/>

      <path d="M 616,356 L 632,372 M 632,356 L 616,372" fill="none" stroke="#eb6c36" stroke-width="1.2"/>

      <text x="112" y="264" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="160" y="292" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Telegram DM</text>
      <text x="160" y="316" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Ahmed identity</text>

      <rect x="80" y="400" width="160" height="96" rx="6" fill="#f5f5f5"/>

      <text x="160" y="476" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">disabled</text>

      <rect x="360" y="240" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="240" width="180" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="372" y="252" width="40" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="392" y="264" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="450" y="292" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gateway gate</text>
      <text x="450" y="316" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">trusted intake</text>

      <rect x="360" y="112" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="112" width="180" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="372" y="124" width="32" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="388" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEY</text>
      <text x="450" y="160" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rotated bearer</text>
      <text x="450" y="180" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">0600 · matched</text>

      <rect x="700" y="240" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="700" y="240" width="180" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="712" y="252" width="56" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="740" y="264" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUNTIME</text>
      <text x="790" y="292" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent runtime</text>
      <text x="790" y="316" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">isolated execution</text>

      <rect x="700" y="400" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="700" y="400" width="180" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="712" y="412" width="48" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="736" y="424" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
      <text x="790" y="452" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recovery guard</text>
      <text x="790" y="476" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">evidence required</text>

      <rect x="360" y="400" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="400" width="180" height="96" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="372" y="412" width="48" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.28)" stroke-width="0.8"/>
      <text x="396" y="424" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BYPASS</text>
      <text x="450" y="452" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blind force reset</text>
      <text x="450" y="476" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">removed</text>

      <rect x="1020" y="240" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="1020" y="240" width="180" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="1032" y="252" width="48" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="1056" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUDIT</text>
      <text x="1110" y="292" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Security proof</text>
      <text x="1110" y="316" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">19/19 · 0 fail</text>

      <!-- Legend strip -->
      <line x1="40" y1="584" x2="1240" y2="584" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">READING KEY</text>
      <line x1="176" y1="608" x2="220" y2="608" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="236" y="612" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Permitted intake</text>
      <line x1="408" y1="608" x2="452" y2="608" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="468" y="612" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Privileged action</text>
      <line x1="652" y1="608" x2="696" y2="608" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,4"/>

      <rect x="928" y="596" width="24" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="968" y="612" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">Audit destination</text>

  </div>
</body>
